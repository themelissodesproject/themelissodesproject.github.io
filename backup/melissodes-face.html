<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Melissodes Head Anatomy</title>
<style>
    /* ——— Reset & base ——— */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f5f4f0;
      font-family: "Georgia", serif;
      padding: 24px 16px 40px;
      min-height: 100vh;
    }

    /* ——— Figure title ——— */
    .figure-title {
      text-align: center;
      font-size: 1.05rem;
      color: #333;
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }

    /* ——— Outer wrapper ——— */
    .figure-wrapper {
      display: flex;
      flex-direction: row;
      gap: 16px;
      justify-content: center;
      align-items: flex-start;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ——— Each panel ——— */
    .figure-panel {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .panel-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #666;
      font-family: sans-serif;
    }

    /* ——— SVG container ——— */
    .figure-svg-wrap {
      width: 100%;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }
    .figure-svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ——— Anatomy fill colors (from source SVG) ——— */
    .s0 { fill: #d3bffe; }   /* labrum */
    .s1 { fill: #000000; }   /* outline/body */
    .s2 { fill: #fefefe; }   /* highlight */
    .s3 { fill: #adadad; }   /* ocelli */
    .s4 { fill: #9fb6b8; }   /* mandible */
    .s5 { fill: #ffbfbf; }   /* clypeus */
    .s6 { fill: #c9a1eb; }   /* malar margin */
    .s7 { fill: #99abff; }   /* frons/genae/vertex */
    .s8 { fill: #bbffed; }   /* eye */

    /* ——— Badge circle colors (with opacity matching source) ——— */
    .s9  { fill: #78dec3; opacity: 0.5; }
    .s11 { fill: #d5d5d5; }   /* lines — gray, not black */
    .s12 { fill: #ffbfbf; opacity: 0.5; }
    .s13 { fill: #cda0e9; opacity: 0.5; }
    .s14 { fill: #9fb6b8; opacity: 0.5; }
    .s15 { fill: #d3bffe; opacity: 0.5; }
    .s16 { fill: #99abff; opacity: 0.5; }
    .s17 { fill: #d5d5d5; opacity: 0.5; }
    .s18 { fill: #010101; }
    .s19 { fill: #feebbf; }
    .s20 { fill: #cda0e9; }
    .s21 { fill: #febfff; }
    .s22 { fill: #febfff; opacity: 0.5; }
    .s23 { fill: #feebbf; opacity: 0.5; }
    .s24 { fill: #000000; opacity: 0.5; }

    /* ——— Style classes for rect fill (label hover backgrounds) ——— */
    .badge-rect.s9  { fill: #78dec3; opacity: 1; }
    .badge-rect.s12 { fill: #ffbfbf; opacity: 1; }
    .badge-rect.s13 { fill: #cda0e9; opacity: 1; }
    .badge-rect.s14 { fill: #9fb6b8; opacity: 1; }
    .badge-rect.s15 { fill: #d3bffe; opacity: 1; }
    .badge-rect.s16 { fill: #99abff; opacity: 1; }
    .badge-rect.s17 { fill: #d5d5d5; opacity: 1; }
    .badge-rect.s22 { fill: #febfff; opacity: 1; }
    .badge-rect.s23 { fill: #feebbf; opacity: 1; }
    .badge-rect.s24 { fill: #555;    opacity: 1; }

    /* ——— Anatomy group base styles ——— */
    .anatomy-group {
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-box: fill-box;
      transform-origin: center;
    }

    /* ——— Badge circle & line transitions ——— */
    .anatomy-group .badge-circles,
    .anatomy-group .badge-number,
    .anatomy-group .badge-line {
      transition: opacity 0.2s ease;
    }

    /* ——— When ANY group is hovered ——— */
    .svg-any-hovered .anatomy-group:not(.hovered) .badge-circles,
    .svg-any-hovered .anatomy-group:not(.hovered) .badge-number {
      opacity: 0;
    }
    .svg-any-hovered .anatomy-group:not(.hovered) .badge-line {
      opacity: 0;
    }
    /* Dim non-hovered groups */
    .svg-any-hovered .anatomy-group:not(.hovered) {
      filter: brightness(0.35) grayscale(0.8);
      transition: filter 0.2s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ——— The hovered group ——— */
   /* REPLACE WITH THESE TWO */

.anatomy-group.hovered .badge-circles {
  transform: scale(1.15);
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.anatomy-shape {
  transition: filter 0.2s ease;
}
.anatomy-shape.anatomy-dimmed {
  filter: brightness(0.3) grayscale(0.8);
}

.anatomy-group.hovered .badge-circles {
  opacity: 0;
  transition: opacity 0.15s ease;
}


    .anatomy-group.hovered .badge-number {
      visibility: hidden;
    }
    .anatomy-group.hovered .badge-line {
      opacity: 1 !important;
    }

    /* ——— Rounded rect (badge-label-group) base ——— */
    .badge-label-group {
      pointer-events: none;
    }

    /* ——— Hint text ——— */
    .figure-hint {
      text-align: center;
      font-size: 0.75rem;
      color: #999;
      margin-top: 14px;
      font-family: sans-serif;
      font-style: italic;
    }

    .badge-line { fill: #d5d5d5; }

/* ——— Badge number text styling (missing from HTML, exists only in source SVG) ——— */
.t10 { font-size: 168px; fill: #ffffff; font-weight: 400; font-family: "DejaVuSans", "DejaVu Sans", sans-serif; }

    /* ——— Responsive: stack below 900px ——— */
    @media (max-width: 900px) {
      .figure-wrapper {
        flex-direction: column;
        gap: 24px;
      }
      .figure-panel {
        width: 100%;
      }
    }
  </style>
</head>

<p class="figure-hint">Hover over a numbered label to identify anatomical features</p>

<script>
const LABELS_FRONTAL = {
  1: "Antennal scape", 2: "Compound eye", 3: "Clypeus",
  4: "Labrum", 5: "Mandible", 6: "Prementum",
  7: "Malar area", 8: "Gena", 9: "Ocelli", 10: "Frons"
};
const LABELS_LATERAL = {
  1: "Vertex", 3: "Gena", 4: "Mandible", 5: "Clypeus",
  6: "Supraclypeal area", 9: "Compound eye", 10: "Ocelli"
};

function wireSVG(svgEl) {
  const groups = Array.from(svgEl.querySelectorAll('.anatomy-group'));

  // All paths/images NOT inside any anatomy-group = the actual bee body shapes
  const anatomyShapes = Array.from(svgEl.querySelectorAll('path, image')).filter(el => {
    return !el.closest('.anatomy-group');
  });

  // Tag body shapes so CSS can target them
  anatomyShapes.forEach(el => el.classList.add('anatomy-shape'));

  // --- Build color → group map (read fill from the badge circle) ---
  const colorToGroup = {};
  groups.forEach(group => {
    const circle = group.querySelector('.badge-circles path');
    if (!circle) return;
    const fill = window.getComputedStyle(circle).fill; // "rgb(r, g, b)"
    colorToGroup[fill] = group;
    group._matchedShapes = []; // will populate below
  });

  // --- Link each anatomy shape to its matching group (same fill color) ---
  anatomyShapes.forEach(shape => {
    const fill = window.getComputedStyle(shape).fill;
    const matchedGroup = colorToGroup[fill] || null;
    shape._matchedGroup = matchedGroup;
    if (matchedGroup) {
      matchedGroup._matchedShapes.push(shape);
    }
  });

  // --- Shared helpers ---
  function showLabel(group) {
    const lbl = group.querySelector('.badge-label-group');
    if (lbl) lbl.setAttribute('visibility', 'visible');
  }
  function hideLabel(group) {
    const lbl = group.querySelector('.badge-label-group');
    if (lbl) lbl.setAttribute('visibility', 'hidden');
  }

  function enterHover(activeGroup) {
    svgEl.classList.add('svg-any-hovered');

    // Reset all groups, then activate the target
    groups.forEach(g => { g.classList.remove('hovered'); hideLabel(g); });
    activeGroup.classList.add('hovered');
    showLabel(activeGroup);

    // Dim ALL anatomy shapes, then un-dim the ones matching this group's color
    // Only dim shapes that have a badge color-match AND are NOT the active one
    anatomyShapes.forEach(el => {
      if (el._matchedGroup && el._matchedGroup !== activeGroup) {
        el.classList.add('anatomy-dimmed');
      }
    });
  }

  function leaveHover(activeGroup) {
    activeGroup.classList.remove('hovered');
    hideLabel(activeGroup);
    setTimeout(() => {
      if (!svgEl.querySelector('.anatomy-group.hovered')) {
        svgEl.classList.remove('svg-any-hovered');
        anatomyShapes.forEach(el => el.classList.remove('anatomy-dimmed'));
      }
    }, 50);
  }

  // --- Wire badge groups ---
  groups.forEach(group => {
    group.addEventListener('mouseenter', () => enterHover(group));
    group.addEventListener('mouseleave', () => leaveHover(group));
  });

  // --- Wire anatomy body shapes ---
  anatomyShapes.forEach(shape => {
    if (!shape._matchedGroup) return; // no color match → skip
    shape.style.cursor = 'pointer';
    shape.addEventListener('mouseenter', () => enterHover(shape._matchedGroup));
    shape.addEventListener('mouseleave', () => leaveHover(shape._matchedGroup));
  });
}

document.addEventListener('DOMContentLoaded', () => {
  wireSVG(document.getElementById('svg-frontal'));
  wireSVG(document.getElementById('svg-lateral'));
});
</script>
