  <div id="hint">Scroll to zoom &nbsp;·&nbsp; Click and drag to pan</div>

  <script>
    const canvas = document.getElementById('canvas');
    const svg = canvas.querySelector('svg');

    let scale = 1;
    let tx = 0;
    let ty = 0;
    const SCALE_MIN = 0.1;
    const SCALE_MAX = 10;
    const SCALE_STEP = 0.15;

    function applyTransform() {
      svg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    }

    // Centre the SVG initially
    function initTransform() {
      const cw = canvas.clientWidth;
      const ch = canvas.clientHeight;
      const svgW = 763;
      const svgH = 1001;
      const fitScale = Math.min(cw / svgW, ch / svgH);
      scale = fitScale;
      tx = (cw - svgW * scale) / 2;
      ty = (ch - svgH * scale) / 2;
      applyTransform();
    }

    initTransform();
    window.addEventListener('resize', initTransform);

    // Zoom centred on a point
    function zoomAt(cx, cy, factor) {
      const newScale = Math.min(SCALE_MAX, Math.max(SCALE_MIN, scale * factor));
      const ratio = newScale / scale;
      tx = cx - ratio * (cx - tx);
      ty = cy - ratio * (cy - ty);
      scale = newScale;
      applyTransform();
    }

    // Wheel zoom
    canvas.addEventListener('wheel', function(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      const factor = e.deltaY < 0 ? (1 + SCALE_STEP) : (1 / (1 + SCALE_STEP));
      zoomAt(cx, cy, factor);
    }, { passive: false });

    // Drag pan
    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    canvas.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      tx += e.clientX - lastX;
      ty += e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      applyTransform();
    });

    window.addEventListener('mouseup', function() {
      dragging = false;
    });

    // Touch support
    let lastTouchDist = null;
    let lastTouchMidX = 0;
    let lastTouchMidY = 0;

    canvas.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        dragging = true;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        lastTouchDist = null;
      } else if (e.touches.length === 2) {
        dragging = false;
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        lastTouchDist = Math.hypot(dx, dy);
        lastTouchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        lastTouchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', function(e) {
      e.preventDefault();
      if (e.touches.length === 1 && dragging) {
        tx += e.touches[0].clientX - lastX;
        ty += e.touches[0].clientY - lastY;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
        applyTransform();
      } else if (e.touches.length === 2 && lastTouchDist !== null) {
        const dx = e.touches[1].clientX - e.touches[0].clientX;
        const dy = e.touches[1].clientY - e.touches[0].clientY;
        const dist = Math.hypot(dx, dy);
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        zoomAt(midX, midY, dist / lastTouchDist);
        lastTouchDist = dist;
        lastTouchMidX = midX;
        lastTouchMidY = midY;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', function() {
      dragging = false;
      lastTouchDist = null;
    });

    // Button controls
    document.getElementById('zoomIn').addEventListener('click', function() {
      const cx = canvas.clientWidth / 2;
      const cy = canvas.clientHeight / 2;
      zoomAt(cx, cy, 1 + SCALE_STEP * 2);
    });

    document.getElementById('zoomOut').addEventListener('click', function() {
      const cx = canvas.clientWidth / 2;
      const cy = canvas.clientHeight / 2;
      zoomAt(cx, cy, 1 / (1 + SCALE_STEP * 2));
    });

    document.getElementById('reset').addEventListener('click', initTransform);
  </script>
