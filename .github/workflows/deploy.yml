name: Build paper database

on:
  push:
    branches: [main]
    paths-ignore:
      - "paper-database/records/**"
      - "paper-database/data/catalog.json"
      - "paper-database/data/species.json"
      - "paper-database/pagefind/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-database-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build metadata + hidden index fragments (in place)
        run: python3 paper-database/scripts/build.py

      - name: Build search index (in place)
        run: |
          for i in 1 2 3; do
            npx --yes pagefind@1.5.2 --site paper-database && break
            echo "pagefind attempt $i failed, retrying..."
            sleep 5
          done

      - name: Commit generated files back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paper-database/records paper-database/data/catalog.json \
                   paper-database/data/species.json paper-database/pagefind
          if git diff --cached --quiet; then
            echo "Nothing changed, skipping commit."
          else
            git commit -m "Rebuild paper database search index [skip ci]"
            git push
          fi
